<h2 style="margin:0 0 8px;font-size:22px;color:#FF4444;">Strategy Paused</h2>
<p style="margin:0 0 24px;font-size:15px;color:#AAAAAA;line-height:1.6;">
  Your strategy <strong style="color:#FFFFFF;">{strategy_name}</strong> has been
  automatically paused.
</p>
<div style="background-color:#0D0D0D;border-left:4px solid #FF4444;padding:16px 20px;border-radius:4px;margin:20px 0;">
  <p style="margin:0;font-size:14px;color:#CCCCCC;">
    <strong style="color:#FF4444;">Reason:</strong> {reason}
  </p>
</div>
<p style="margin:20px 0 0;font-size:14px;color:#AAAAAA;line-height:1.6;">
  Review your strategy settings and reactivate when ready.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto 0;">
  <tr>
    <td align="center" style="background-color:#39FF14;border-radius:8px;">
      <a href="{frontend_url}/strategies" target="_blank" style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:600;color:#0D0D0D;text-decoration:none;letter-spacing:0.5px;">
        Review Strategy
      </a>
    </td>
  </tr>
</table>
