<h2 style="margin:0 0 8px;font-size:22px;color:#FFFFFF;">Subscription Activated</h2>
<p style="margin:0 0 24px;font-size:15px;color:#AAAAAA;line-height:1.6;">
  Your <strong style="color:#39FF14;">{plan_name}</strong> plan is now active.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" width="100%">
  <tr>
    <td style="padding:8px 0;font-size:14px;color:#888888;width:140px;">Plan</td>
    <td style="padding:8px 0;font-size:14px;color:#FFFFFF;font-weight:500;">{plan_name}</td>
  </tr>
  <tr>
    <td style="padding:8px 0;font-size:14px;color:#888888;width:140px;">Billing Cycle</td>
    <td style="padding:8px 0;font-size:14px;color:#FFFFFF;font-weight:500;">{billing_cycle}</td>
  </tr>
  <tr>
    <td style="padding:8px 0;font-size:14px;color:#888888;width:140px;">Active Until</td>
    <td style="padding:8px 0;font-size:14px;color:#FFFFFF;font-weight:500;">{expires_at}</td>
  </tr>
</table>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto 0;">
  <tr>
    <td align="center" style="background-color:#39FF14;border-radius:8px;">
      <a href="{frontend_url}/billing" target="_blank" style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:600;color:#0D0D0D;text-decoration:none;letter-spacing:0.5px;">
        View Subscription
      </a>
    </td>
  </tr>
</table>
