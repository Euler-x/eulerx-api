<!-- Button Component: {text}, {url} -->
<!--BUTTON-->
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto 0;">
  <tr>
    <td align="center" style="background-color:#39FF14;border-radius:8px;">
      <a href="{url}" target="_blank" style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:600;color:#0D0D0D;text-decoration:none;letter-spacing:0.5px;">
        {text}
      </a>
    </td>
  </tr>
</table>

<!-- Divider Component -->
<!--DIVIDER-->
<hr style="border:none;border-top:1px solid #2A2A2A;margin:24px 0;">

<!-- Key-Value Row Component: {label}, {value} -->
<!--KV_ROW-->
<tr>
  <td style="padding:8px 0;font-size:14px;color:#888888;width:140px;">{label}</td>
  <td style="padding:8px 0;font-size:14px;color:#FFFFFF;font-weight:500;">{value}</td>
</tr>
