<h2 style="margin:0 0 8px;font-size:22px;color:#FFFFFF;">Subscription Expiring Soon</h2>
<p style="margin:0 0 24px;font-size:15px;color:#AAAAAA;line-height:1.6;">
  Your <strong style="color:#39FF14;">{plan_name}</strong> plan expires on
  <strong style="color:#FFFFFF;">{expires_at}</strong>.
  Renew now to keep your automated trading strategies running.
</p>
<div style="text-align:center;margin:20px 0;">
  <span style="font-size:48px;font-weight:700;color:#39FF14;">{days_remaining}</span>
  <span style="font-size:16px;color:#888888;display:block;">days remaining</span>
</div>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto 0;">
  <tr>
    <td align="center" style="background-color:#39FF14;border-radius:8px;">
      <a href="{frontend_url}/billing" target="_blank" style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:600;color:#0D0D0D;text-decoration:none;letter-spacing:0.5px;">
        Renew Subscription
      </a>
    </td>
  </tr>
</table>
