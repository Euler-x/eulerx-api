<h2 style="margin:0 0 8px;font-size:22px;color:#FFFFFF;">Support Ticket Updated</h2>
<p style="margin:0 0 24px;font-size:15px;color:#AAAAAA;line-height:1.6;">
  Your support ticket has been updated.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" width="100%">
  <tr>
    <td style="padding:8px 0;font-size:14px;color:#888888;width:140px;">Subject</td>
    <td style="padding:8px 0;font-size:14px;color:#FFFFFF;font-weight:500;">{ticket_subject}</td>
  </tr>
  <tr>
    <td style="padding:8px 0;font-size:14px;color:#888888;width:140px;">Status</td>
    <td style="padding:8px 0;font-size:14px;color:#FFFFFF;font-weight:500;"><span style="color:#39FF14;">{new_status}</span></td>
  </tr>
</table>
{reply_section}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto 0;">
  <tr>
    <td align="center" style="background-color:#39FF14;border-radius:8px;">
      <a href="{frontend_url}/support" target="_blank" style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:600;color:#0D0D0D;text-decoration:none;letter-spacing:0.5px;">
        View Ticket
      </a>
    </td>
  </tr>
</table>
