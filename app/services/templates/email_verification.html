<h2 style="margin:0 0 8px;font-size:22px;color:#FFFFFF;">Verify Your Email</h2>
<p style="margin:0 0 24px;font-size:15px;color:#AAAAAA;line-height:1.6;">
  Enter the code below in the app to complete your email verification.
</p>
<div style="text-align:center;margin:20px 0 28px;">
  <div style="display:inline-block;background-color:#0D0D0D;border:2px solid #39FF14;border-radius:10px;padding:18px 40px;letter-spacing:12px;font-size:32px;font-weight:700;color:#39FF14;font-family:monospace;">
    {code}
  </div>
</div>
<p style="margin:0;font-size:13px;color:#666666;text-align:center;">
  This code expires in {expiry_minutes} minutes.
</p>
