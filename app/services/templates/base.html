<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{title}</title>
</head>
<body style="margin:0;padding:0;background-color:#0D0D0D;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0D0D0D;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
          <!-- Header -->
          <tr>
            <td align="center" style="padding-bottom:30px;">
              <img src="https://res.cloudinary.com/dpwddkw5t/image/upload/v1776112896/logo_dark_mdhe1l.png" alt="EulerX" width="140" style="display:block;height:auto;border:0;" />
            </td>
          </tr>
          <!-- Card -->
          <tr>
            <td style="background-color:#1A1A1A;border-radius:12px;border:1px solid #2A2A2A;padding:40px 36px;">
              {body_content}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:30px;">
              <p style="margin:0;font-size:12px;color:#555555;line-height:1.6;">
                This is an automated message from EulerX Network.<br>
                Please do not reply to this email.
              </p>
              <p style="margin:10px 0 0;font-size:11px;color:#444444;">
                &copy; 2025 EulerX Network. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
