<h2 style="margin:0 0 8px;font-size:22px;color:#FFFFFF;">Reset Your Password</h2>
<p style="margin:0 0 24px;font-size:15px;color:#AAAAAA;line-height:1.6;">
  Click the button below to reset your password. This link expires in 30 minutes.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto 0;">
  <tr>
    <td align="center" style="background-color:#39FF14;border-radius:8px;">
      <a href="{reset_link}" target="_blank" style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:600;color:#0D0D0D;text-decoration:none;letter-spacing:0.5px;">
        Reset Password
      </a>
    </td>
  </tr>
</table>
<p style="margin:20px 0 0;font-size:13px;color:#666666;text-align:center;">
  If you didn't request this, you can safely ignore this email.
</p>
