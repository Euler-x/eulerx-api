[project]
name = "eulerx-backend"
version = "0.1.0"
description = "EulerX Network - AI-driven automated trading infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=22.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.8.0",
    "cryptography>=44.0.0",
    "eth-account>=0.13.0",
    "hyperliquid-python-sdk>=0.8.1",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "web3>=7.14.1",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "email-validator>=2.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "coverage>=7.6.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
