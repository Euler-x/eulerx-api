name: EulerX Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ── Lint ────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Minimize uv cache
        run: uv cache prune --ci

  # ── Test ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "sqlite+aiosqlite://"
      JWT_SECRET_KEY: "test-secret-key-for-ci-minimum-32chars"
      WALLET_ENCRYPTION_KEY: "V9vI8kEq1T21ktsHaHiAS3La84oAGWG5eyQaCLiju2k="
      TELEGRAM_ENCRYPTION_KEY: "V9vI8kEq1T21ktsHaHiAS3La84oAGWG5eyQaCLiju2k="
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_TASK_ALWAYS_EAGER: "true"
      OPENROUTER_API_KEY: "sk-test-fake"
      ZEPTOMAIL_TOKEN: "fake-zeptomail-token"
      SENTRY_DSN: ""
      ENVIRONMENT: "testing"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest -v --tb=short --co -q 2>/dev/null; uv run pytest -v --tb=short

      - name: Minimize uv cache
        run: uv cache prune --ci

  # ── Deploy ──────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            APP_DIR="/home/eulerx/eulerx-api"
            cd "$APP_DIR"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing dependencies..."
            uv sync --no-dev

            echo "==> Running migrations..."
            uv run alembic upgrade head

            echo "==> Restarting services..."
            sudo systemctl restart eulerx-api
            sudo systemctl restart eulerx-celery
            sudo systemctl restart eulerx-beat

            echo "==> Verifying health..."
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health)
            if [ "$STATUS" != "200" ]; then
              echo "Health check failed (HTTP $STATUS)"
              sudo journalctl -u eulerx-api --no-pager -n 30
              exit 1
            fi
            echo "==> Deploy complete (health: HTTP $STATUS)"
